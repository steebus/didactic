# The checks that need no credentials, run on every push, so a break is
# found here rather than on someone's next checkout. The build is Vercel's:
# it builds every push through its GitHub connection.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # lint, typecheck and test need no credentials: the unit tests mock
      # the SDKs and the integration tests skip themselves when the local
      # Postgres is absent, which it is here.
      - run: npx turbo run lint typecheck test

      # The build is deliberately not run here. Vercel builds every push
      # through its GitHub connection, so a build in CI would be a second
      # build of the same commit -- and every route constructs a Supabase
      # admin client at module load, so it would need the service role key
      # in Actions to tell us what Vercel already tells us.
